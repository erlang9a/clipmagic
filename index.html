<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClipAI - Viral Video Clipper</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            black: '#050505',
                            dark: '#111111',
                            darker: '#0a0a0a',
                            light: '#f5f5f5',
                            red: '#e50914',
                            redHover: '#b8070f'
                        }
                    },
                    animation: {
                        'pulse-fast': 'pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    }
                }
            }
        }
    </script>

    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            background-color: #050505;
            color: #f5f5f5;
        }
        /* Custom styles for the auto-caption to mimic TikTok/Reels */
        .caption-text {
            color: #ffd700;
            text-transform: uppercase;
            font-weight: 900;
            text-align: center;
            line-height: 1.1;
            /* Black stroke effect */
            -webkit-text-stroke: 1.5px black;
            text-shadow: 2px 2px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
        }
        
        /* Hide scrollbar for clean aesthetic */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #050505;
        }
        ::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- Mock Data Generator ---
        const generateMockClips = () => {
            const templates = [
                { title: "The unspoken truth about AI", caption: "AI IS NOT YOUR ENEMY" },
                { title: "Why you're always tired", caption: "STOP DOING THIS EVERY MORNING" },
                { title: "Billionaire mindset shift", caption: "MONEY FOLLOWS THIS ONE RULE" },
                { title: "The psychology of attraction", caption: "MAKE THEM OBSESSED WITH YOU" },
                { title: "You are being manipulated", caption: "THE MEDIA WANTS YOU POOR" },
                { title: "Stop wasting your 20s", caption: "YOUR 20S ARE FOR BUILDING" },
                { title: "The dopamine detox guide", caption: "RESET YOUR BRAIN TODAY" },
                { title: "How to read anyone instantly", caption: "LOOK AT THEIR FEET FIRST" },
                { title: "The matrix is real", caption: "WAKE UP FROM THE ILLUSION" },
                { title: "Mastering deep work", caption: "FOCUS LIKE A LASER BEAM" },
                { title: "Diet myths busted", caption: "CARBS ARE NOT THE PROBLEM" },
                { title: "Crypto in 2027", caption: "THE NEXT MASSIVE BULL RUN" }
            ];

            // Shuffle and pick 10
            const shuffled = templates.sort(() => 0.5 - Math.random()).slice(0, 10);
            
            // Assign random scores leaning towards high numbers for "viral" feel
            return shuffled.map((item, index) => ({
                id: index + 1,
                title: item.title,
                caption: item.caption,
                score: Math.floor(Math.random() * 25) + 75, // 75 to 99
                duration: `0:${Math.floor(Math.random() * 40 + 15)}` // 0:15 to 0:54
            })).sort((a, b) => b.score - a.score); // Sort highest to lowest
        };

        const App = () => {
            const [url, setUrl] = useState('');
            const [status, setStatus] = useState('idle'); // idle, processing, complete
            const [loadingStep, setLoadingStep] = useState(0);
            const [clips, setClips] = useState([]);
            const [toast, setToast] = useState(null);

            const steps = [
                "Downloading high-res video...",
                "Extracting audio & transcribing...",
                "AI is identifying viral hooks...",
                "Auto-cropping to 9:16 portrait...",
                "Rendering dynamic captions..."
            ];

            const handleGenerate = (e) => {
                e.preventDefault();
                if (!url.trim()) {
                    showToast("Please enter a valid YouTube URL", "error");
                    return;
                }

                setStatus('processing');
                setLoadingStep(0);
                
                // Simulate processing steps
                let currentStep = 0;
                const interval = setInterval(() => {
                    currentStep++;
                    if (currentStep < steps.length) {
                        setLoadingStep(currentStep);
                    } else {
                        clearInterval(interval);
                        setClips(generateMockClips());
                        setStatus('complete');
                    }
                }, 1200); // 1.2s per step
            };

            const showToast = (message, type = "success") => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 3000);
            };

            const handleDownload = (clipTitle) => {
                showToast(`Preparing HD download for "${clipTitle}"...`);
            };

            return (
                <div className="min-h-screen flex flex-col font-sans selection:bg-brand-red selection:text-white">
                    
                    {/* Toast Notification */}
                    {toast && (
                        <div className={`fixed top-6 left-1/2 transform -translate-x-1/2 z-50 px-6 py-3 rounded-full shadow-2xl flex items-center gap-3 transition-all duration-300 ${toast.type === 'error' ? 'bg-red-900 text-white' : 'bg-brand-dark text-brand-light border border-white/10'}`}>
                            <i className={`fas ${toast.type === 'error' ? 'fa-exclamation-circle text-brand-red' : 'fa-check-circle text-green-500'}`}></i>
                            <span className="font-medium text-sm">{toast.message}</span>
                        </div>
                    )}

                    {/* Navigation */}
                    <nav className="border-b border-white/5 bg-brand-black sticky top-0 z-40">
                        <div className="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
                            <div className="flex items-center gap-2 text-brand-light">
                                <i className="fas fa-bolt text-brand-red text-xl"></i>
                                <span className="font-black tracking-tight text-xl">Clip<span className="text-brand-red">AI</span></span>
                            </div>
                            <div className="flex gap-4">
                                <button className="text-sm font-medium text-gray-400 hover:text-brand-light transition-colors">Pricing</button>
                                <button className="text-sm font-medium text-gray-400 hover:text-brand-light transition-colors">Login</button>
                            </div>
                        </div>
                    </nav>

                    <main className="flex-grow flex flex-col relative px-4 sm:px-6">
                        
                        {/* Status: IDLE */}
                        {status === 'idle' && (
                            <div className="max-w-3xl mx-auto w-full mt-24 text-center flex flex-col items-center animate-fade-in">
                                <div className="inline-block border border-brand-red/30 bg-brand-red/10 text-brand-red px-4 py-1.5 rounded-full text-xs font-bold uppercase tracking-wider mb-6">
                                    <i className="fas fa-fire mr-2"></i> Viral Engine v2.0
                                </div>
                                <h1 className="text-4xl sm:text-6xl font-black mb-6 leading-tight tracking-tight">
                                    Turn any YouTube video into <br/>
                                    <span className="text-brand-red">10 viral shorts.</span>
                                </h1>
                                <p className="text-gray-400 text-lg mb-10 max-w-xl">
                                    Our AI automatically analyzes your long-form content, extracts the most engaging moments, crops to 9:16, and adds dynamic captions.
                                </p>

                                <form onSubmit={handleGenerate} className="w-full max-w-2xl relative flex flex-col sm:flex-row gap-3">
                                    <div className="relative flex-grow">
                                        <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                            <i className="fab fa-youtube text-gray-500 text-lg"></i>
                                        </div>
                                        <input 
                                            type="text" 
                                            value={url}
                                            onChange={(e) => setUrl(e.target.value)}
                                            placeholder="Paste YouTube URL here..." 
                                            className="w-full bg-brand-dark border border-gray-800 text-brand-light rounded-xl py-4 pl-12 pr-4 focus:outline-none focus:border-brand-red focus:ring-1 focus:ring-brand-red transition-all"
                                        />
                                    </div>
                                    <button 
                                        type="submit"
                                        className="bg-brand-red hover:bg-brand-redHover text-white font-bold py-4 px-8 rounded-xl transition-all flex items-center justify-center gap-2 whitespace-nowrap shadow-[0_0_20px_-5px_rgba(229,9,20,0.4)]"
                                    >
                                        Generate Clips <i className="fas fa-magic"></i>
                                    </button>
                                </form>
                            </div>
                        )}

                        {/* Status: PROCESSING */}
                        {status === 'processing' && (
                            <div className="max-w-xl mx-auto w-full mt-32 flex flex-col items-center">
                                <div className="relative w-24 h-24 mb-8 flex items-center justify-center">
                                    <div className="absolute inset-0 border-4 border-brand-dark rounded-full"></div>
                                    <div className="absolute inset-0 border-4 border-brand-red rounded-full border-t-transparent animate-spin"></div>
                                    <i className="fas fa-robot text-3xl text-gray-300"></i>
                                </div>
                                <h2 className="text-2xl font-bold mb-8 text-brand-light">Processing Video</h2>
                                
                                <div className="w-full space-y-4">
                                    {steps.map((step, idx) => {
                                        const isActive = idx === loadingStep;
                                        const isPast = idx < loadingStep;
                                        return (
                                            <div key={idx} className={`flex items-center p-4 rounded-xl border transition-all duration-300 ${isActive ? 'bg-brand-dark border-brand-red/50 shadow-[0_0_15px_-5px_rgba(229,9,20,0.3)]' : isPast ? 'bg-transparent border-gray-800' : 'bg-transparent border-transparent opacity-40'}`}>
                                                <div className={`w-6 h-6 rounded-full flex items-center justify-center mr-4 text-xs font-bold ${isPast ? 'bg-green-500 text-white' : isActive ? 'bg-brand-red text-white animate-pulse' : 'bg-gray-800 text-gray-500'}`}>
                                                    {isPast ? <i className="fas fa-check"></i> : idx + 1}
                                                </div>
                                                <span className={`font-medium ${isActive ? 'text-brand-light' : 'text-gray-500'}`}>{step}</span>
                                            </div>
                                        )
                                    })}
                                </div>
                            </div>
                        )}

                        {/* Status: COMPLETE */}
                        {status === 'complete' && (
                            <div className="max-w-7xl mx-auto w-full py-12">
                                <div className="flex flex-col sm:flex-row items-start sm:items-end justify-between mb-8 pb-6 border-b border-gray-800 gap-4">
                                    <div>
                                        <h2 className="text-3xl font-black mb-2 flex items-center gap-3">
                                            Viral Clips Generated <i className="fas fa-check-circle text-green-500 text-2xl"></i>
                                        </h2>
                                        <p className="text-gray-400">We found 10 highly engaging moments ranked by viral potential.</p>
                                    </div>
                                    <button 
                                        onClick={() => { setStatus('idle'); setUrl(''); setClips([]); }}
                                        className="bg-brand-dark hover:bg-gray-800 border border-gray-700 text-brand-light px-5 py-2.5 rounded-lg text-sm font-semibold transition-colors"
                                    >
                                        <i className="fas fa-plus mr-2"></i> New Video
                                    </button>
                                </div>

                                <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-6">
                                    {clips.map((clip) => (
                                        <div key={clip.id} className="bg-brand-darker border border-gray-800 rounded-2xl overflow-hidden group hover:border-gray-600 transition-all flex flex-col">
                                            
                                            {/* Video Mockup (9:16) */}
                                            <div className="relative aspect-[9/16] bg-brand-dark overflow-hidden flex flex-col items-center justify-center p-4">
                                                {/* Simulated Video Background */}
                                                <div className="absolute inset-0 bg-gradient-to-b from-gray-800 to-black opacity-40"></div>
                                                <div className="absolute inset-0 bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0IiBoZWlnaHQ9IjQiPjxyZWN0IHdpZHRoPSI0IiBoZWlnaHQ9IjQiIGZpbGw9IiNmZmYiIGZpbGwtb3BhY2l0eT0iMC4wNSIvPjwvc3ZnPg==')] opacity-30"></div>
                                                
                                                {/* Score Badge */}
                                                <div className={`absolute top-3 left-3 z-10 px-2 py-1 rounded-md text-[10px] font-black uppercase flex items-center gap-1 shadow-lg border ${clip.score >= 90 ? 'bg-brand-red text-white border-brand-red' : 'bg-gray-900 text-brand-light border-gray-700'}`}>
                                                    <i className="fas fa-fire-flame-curved"></i> {clip.score} Viral Score
                                                </div>

                                                {/* Duration Badge */}
                                                <div className="absolute top-3 right-3 z-10 px-2 py-1 rounded-md text-[10px] font-mono bg-black/60 text-gray-300 backdrop-blur-sm">
                                                    {clip.duration}
                                                </div>

                                                {/* Play Button Overlay (Hover) */}
                                                <div className="absolute inset-0 z-20 flex items-center justify-center opacity-0 group-hover:opacity-100 bg-black/20 transition-opacity backdrop-blur-[1px] cursor-pointer">
                                                    <div className="w-12 h-12 bg-white/10 rounded-full flex items-center justify-center border border-white/20 backdrop-blur-md">
                                                        <i className="fas fa-play text-white ml-1"></i>
                                                    </div>
                                                </div>

                                                {/* Simulated Auto-Caption */}
                                                <div className="relative z-10 w-full mt-auto mb-10 transform group-hover:scale-105 transition-transform duration-300">
                                                    <h3 className="text-xl sm:text-2xl caption-text">
                                                        {clip.caption.split(' ').map((word, i) => (
                                                            <span key={i} className={i % 3 === 0 ? "text-white" : ""}>{word} </span>
                                                        ))}
                                                    </h3>
                                                </div>
                                            </div>

                                            {/* Details & Actions */}
                                            <div className="p-4 flex flex-col flex-grow bg-brand-dark">
                                                <h4 className="text-sm font-bold text-brand-light mb-4 line-clamp-2 leading-snug">
                                                    {clip.title}
                                                </h4>
                                                
                                                <button 
                                                    onClick={() => handleDownload(clip.title)}
                                                    className="mt-auto w-full bg-brand-black hover:bg-gray-800 border border-gray-700 text-brand-light py-2 rounded-lg text-sm font-bold transition-colors flex items-center justify-center gap-2"
                                                >
                                                    <i className="fas fa-download text-brand-red"></i> Download HD
                                                </button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                    </main>
                    
                    {/* Footer */}
                    <footer className="py-6 text-center text-xs text-gray-600 border-t border-white/5 mt-auto bg-brand-black">
                        <p>&copy; 2026 ClipAI Simulator. Pure HTML + React CDN setup.</p>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
